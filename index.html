    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pemsa">
    <meta name="mobile-web-app-capable" content="yes">

    <meta name="theme-color" content="FFFFFF">

    <link rel="apple-touch-icon" href="cielogo.jpg">
    <link rel="icon" type="image/jpeg" href="cielogo.jpg">

    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22Pemsa%20App%22%2C%22short_name%22%3A%22Pemsa%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22%2F%22%2C%22background_color%22%3A%22%23FFFFFF%22%2C%22theme_color%22%3A%22%23002366%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22cielogo.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%7D%5D%7D">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #FFFFFF; /* Fondo azul marino durante la carga */
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbz3fl9VAqwmMryfzP2I7KgQUV7aGLIojaVcKdl_Q-7l3YxqBFCDYMUsK7SD3Hdx0izh/exec" allowfullscreen></iframe>
    

    <script>
        // Service Worker interno para habilitar la instalación en el móvil
        if ('serviceWorker' in navigator) {
            const swCode = "self.addEventListener('fetch', function(e){});";
            const blob = new Blob([swCode], {type: 'text/javascript'});
            const url = URL.createObjectURL(blob);
            navigator.serviceWorker.register(url);
        }
    </script>
</body>
</html>
